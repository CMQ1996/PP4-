
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Form | NewsHub</title>
    <link rel="stylesheet" href="{% static 'news/css/style.css' %}">
    <!-- Favicon generated using https://favicon.io/favicon-converter/
     File paths adapted for Django static files -->
<link rel="apple-touch-icon" sizes="180x180"
    href="{% static 'news/favicon/apple-touch-icon.png' %}">
<link rel="icon" type="image/png" sizes="32x32"
    href="{% static 'news/favicon/favicon-32x32.png' %}">
<link rel="icon" type="image/png" sizes="16x16"
    href="{% static 'news/favicon/favicon-16x16.png' %}">
<link rel="manifest"
    href="{% static 'news/favicon/site.webmanifest' %}">
</head>
<body>

    <header>
        <h1>NewsHub</h1>
        <a href="{% url 'post_list' %}">Back to Homepage</a>
    </header>

    <main>
        <article>
            {% if form.instance.pk %}
                <h2>Edit Post</h2>
            {% else %}
                <h2>Create a News Post</h2>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                {% if form.instance.pk %}
                    <button type="submit">Save Changes</button>
                {% else %}
                    <button type="submit">Publish Post</button>
                {% endif %}
            </form>

            <p>
                <a href="{% url 'post_list' %}">Cancel</a>
            </p>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 NewsHub</p>
    </footer>

</body>
</html>
