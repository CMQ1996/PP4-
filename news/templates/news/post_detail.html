<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} | NewsHub</title>
</head>
<body>
    <header>
        <h1>NewsHub</h1>
        <a href="{% url 'post_list' %}">Back to all posts</a>
    </header>

    <main>
        <article>
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
            <p>
                Posted by {{ post.author.username }}
                on {{ post.created_at|date:"d M Y" }}
            </p>
        </article>
    </main>
</body>
</html>
