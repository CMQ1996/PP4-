
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Comment | NewsHub</title>
    <link rel="stylesheet" href="{% static 'news/css/style.css' %}">
</head>
<body>

    <header>
        <h1>NewsHub</h1>
        <a href="{% url 'post_list' %}">Back to Homepage</a>
    </header>

    <main>
        <article>
            <h2>Delete Comment</h2>

            <p>Are you sure you want to delete this comment?</p>

            <p>{{ comment.body }}</p>

            <p>This action cannot be undone.</p>

            <form method="POST">
                {% csrf_token %}
                <button type="submit">Yes, Delete Comment</button>
            </form>

            <p>
                <a href="{% url 'post_detail' comment.post.pk %}">
                    Cancel
                </a>
            </p>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 NewsHub</p>
    </footer>

</body>
</html>
