
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Post | NewsHub</title>
</head>
<body>

    <header>
        <h1>NewsHub</h1>
        <a href="{% url 'post_list' %}">Back to Homepage</a>
    </header>

    <main>
        <h2>Delete Post</h2>

        <p>
            Are you sure you want to delete
            "{{ post.title }}"?
        </p>

        <p>This action cannot be undone.</p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit">
                Yes, Delete Post
            </button>
        </form>

        <p>
            <a href="{% url 'post_detail' post.pk %}">
                Cancel
            </a>
        </p>
    </main>

    <footer>
        <p>&copy; 2026 NewsHub</p>
    </footer>

</body>
</html>
