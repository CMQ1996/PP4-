
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Comment | NewsHub</title>
</head>
<body>

    <header>
        <h1>NewsHub</h1>
        <a href="{% url 'post_list' %}">Back to Homepage</a>
    </header>

    <main>
        <h2>Edit Comment</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Save Changes</button>
        </form>

        <p>
            <a href="{% url 'post_detail' comment.post.pk %}">
                Cancel
            </a>
        </p>
    </main>

    <footer>
        <p>&copy; 2026 NewsHub</p>
    </footer>

</body>
</html>
